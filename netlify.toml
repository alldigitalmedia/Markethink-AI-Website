[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/start/thanks"
  to = "/start/thanks/index.html"
  status = 200

[[redirects]]
  from = "/start/thanks/"
  to = "/start/thanks/index.html"
  status = 200

[[redirects]]
  from = "/start/*"
  to = "/start/"
  status = 200

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex, follow"
